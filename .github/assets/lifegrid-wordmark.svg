<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="gridGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
  </defs>

  <!-- Dark Canvas -->
  <rect width="100%" height="100%" fill="#090D16" rx="16"/>

  <!-- Icon Mark -->
  <g transform="translate(25, 20)">
    <path d="M 20,20 L 80,20 M 20,40 L 80,40 M 20,60 L 80,60 M 40,20 L 40,80 M 60,20 L 60,80" 
          stroke="#1E293B" stroke-width="1.5" stroke-dasharray="2 2" />
    <path d="M 20,20 L 20,80 L 50,80" 
          stroke="url(#gridGlow)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M 80,35 L 80,20 L 40,20 L 40,60 L 80,60 L 80,45 L 60,45" 
          stroke="url(#gridGlow)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="20" cy="20" r="4.5" fill="#06B6D4" />
    <circle cx="40" cy="20" r="4.5" fill="#3B82F6" />
    <circle cx="80" cy="20" r="4.5" fill="#06B6D4" />
    <circle cx="20" cy="80" r="4.5" fill="#3B82F6" />
    <circle cx="50" cy="80" r="4.5" fill="#10B981" />
    <circle cx="80" cy="60" r="4.5" fill="#10B981" />
    <circle cx="60" cy="45" r="4.5" fill="#06B6D4" />
  </g>

  <!-- Text -->
  <g transform="translate(135, 72)">
    <text font-family="sans-serif" font-weight="800" font-size="42" fill="url(#textGrad)" letter-spacing="-0.5">Life</text>
    <text x="82" font-family="sans-serif" font-weight="400" font-size="42" fill="#06B6D4" letter-spacing="-0.5">Grid</text>
    <text x="2" y="22" font-family="sans-serif" font-weight="500" font-size="11" fill="#64748B" letter-spacing="2.5">AUTONOMOUS AGENT PLATFORM</text>
  </g>
</svg>
